global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: order-api
    static_configs:
      - targets: ["order-api:3000"]

  - job_name: payment-svc
    static_configs:
      - targets: ["payment-svc:3002"]