name: chaos-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: chaos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-svc:
    build: ./services/payment-svc
    ports: ["3002:3002"]
    environment:
      PORT: "3002"
      PAYMENT_LATENCY_MS: "50"
      PAYMENT_FAILURE_RATE: "0"
    volumes:
      - ./services/payment-svc/src:/app/src:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-api:
    build: ./services/order-api
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://chaos:chaos@postgres:5432/chaos
      REDIS_URL: redis://redis:6379
      PAYMENT_URL: http://payment-svc:3002
      PAYMENT_TIMEOUT_MS: "1000"
      CACHE_TTL_SECONDS: "30"
    volumes:
      - ./services/order-api/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-svc:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.15.1
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:13.2.4
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pgdata:
  grafana-data: